name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline GUI, serial and collector tests
        run: python -m unittest discover -s tests -v
      - name: Check scripts and example plan
        run: |
          bash -n netdesk netdesk-gui install.sh install-desktop.sh tools/serial/*
          python -m py_compile netdesk.py netdesk_batch.py netdesk_gui.py netdesk_presets.py
          python netdesk.py batch examples/multi-scenario.json --dry-run
