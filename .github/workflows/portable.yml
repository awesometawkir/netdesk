name: Portable desktop builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"
      - name: Build portable folder and archive
        run: python packaging/build.py
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          NETDESK_DATA_DIR: ${{ runner.temp }}/netdesk-test-data
        run: ./dist/NetDesk/NetDesk --smoke-test
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          NETDESK_DATA_DIR: ${{ runner.temp }}/netdesk-test-data
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/NetDesk/NetDesk.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NetDesk smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NetDesk-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
